services:
  gitlab-runner:
    image: 'gitlab/gitlab-runner:alpine3.21-v18.8.0'
    container_name: gitlab-runner
    restart: always
    environment:
      - HTTP_PROXY=http://192.168.1.247:8080 
      - HTTPS_PROXY=http://192.168.1.247:8080
      - NO_PROXY=localhost,127.0.0.1,192.168.1.235,192.168.1.247
    volumes:
      - '/srv/gitlab-runner/config:/etc/gitlab-runner'
      - '/var/run/docker.sock:/var/run/docker.sock'







    