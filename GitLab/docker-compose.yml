services:
  gitlab:
    image: 'gitlab/gitlab-ce:18.8.11-ce.0'
    restart: always
    hostname: 'gitlab.local'
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        # Base URL Routing using local Server IP
        external_url 'http://192.168.1.235'
        
        # Reverse Proxy Adjustments
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        
        # Secure Root Password Path (Writes inside container to avoid log leaks)
        gitlab_rails['initial_root_password_values_filename'] = '/etc/gitlab/initial_root_password'
        
    ports:
      - '80:80'    # HTTP Web UI
      - '443:443'  # HTTPS (Reserved)
      - '2222:22'  # SSH Routing (Shifted to prevent host port 22 conflicts)
    volumes:
      - '/srv/gitlab/config:/etc/gitlab'
      - '/srv/gitlab/logs:/var/log/gitlab'
      - '/srv/gitlab/data:/var/opt/gitlab'
    shm_size: '256m'