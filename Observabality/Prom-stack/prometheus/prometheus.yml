global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  # Scrape Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Scrape Host Metrics (Node Exporter)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Scrape Container Metrics (cAdvisor)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # Scrape Log Aggregator Metrics (Loki)
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]

  # Scrape Tracing Metrics (Tempo)
  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]

  # Optional: OpenTelemetry Collector metrics (uncomment if you uncomment otel-collector service)
  # - job_name: "otel-collector"
  #   static_configs:
  #     - targets: ["otel-collector:8888"]
