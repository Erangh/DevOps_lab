
# ─────────────────────────────────────────────────────────────────────────────
# Prometheus + Grafana + Loki Local Dev Stack
# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   docker compose up -d
#
# Web UIs:
#   Grafana:        http://localhost:3000    (admin / admin123 — change on first login)
#   Prometheus:     http://localhost:9090
#   Alertmanager:   http://localhost:9093
#   Pushgateway:    http://localhost:9091
#   Loki:           http://localhost:3100
#   Tempo:          http://localhost:3200 (status only — traces viewed in Grafana)
#   OTel Collector: http://localhost:4317 (OTLP gRPC) / :4318 (OTLP HTTP) / :8889 (Prometheus metrics)
#   HotROD demo:    http://localhost:8081 (generates sample traces across microservices)
#   Node Exporter:  http://localhost:9100/metrics
#   cAdvisor:       http://localhost:8080
#
# Promtail runs in host-network mode so it can tail /var/log and Docker logs.
# ─────────────────────────────────────────────────────────────────────────────

x-restart: &restart unless-stopped

networks:
  monitoring:
    name: monitoring

volumes:
  prometheus_data: {}
  grafana_data: {}
  alertmanager_data: {}
  loki_data: {}
  tempo_data: {}

services:
  # ── Prometheus ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: prometheus
    restart: *restart
    volumes:
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"             # allow /-/reload to refresh config
      - "--web.enable-admin-api"            # needed for snapshot/delete APIs
      #- "--web.enable-remote-write-receiver" # accept OTel/Prometheus remote writes (from otel-collector)
    # NOTE: No TLS/auth. Add --web.config.file=/etc/prometheus/web.yml and
    # a reverse proxy (Traefik/Nginx/Caddy) before exposing beyond localhost.
    ports:
      - "9090:9090"
    networks:
      - monitoring
    depends_on:
      - alertmanager

  # ── Alertmanager ─────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.33.1
    container_name: alertmanager
    restart: *restart
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"
    networks:
      - monitoring

  # ── Node Exporter (host metrics) ─────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: *restart
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/.+)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - monitoring

  # ── cAdvisor (container metrics) ─────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: *restart
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro  # Required for cgroup v2
    ports:
      - "8080:8080"
    networks:
      - monitoring

  # ── Pushgateway ──────────────────────────────────────────────────────────
  #pushgateway:
  #  image: prom/pushgateway:latest
  #  container_name: pushgateway
  #  restart: *restart
  #  ports:
  #    - "9091:9091"
  #  networks:
  #    - monitoring

  # ── Loki (log storage) ───────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.6.13
    container_name: loki
    restart: *restart
    user: "10001:10001"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - monitoring

  # ── Promtail (log shipper) ───────────────────────────────────────────────
  # Runs in host networking mode to access /var/log and Docker socket
  promtail:
    image: grafana/promtail:3.6.11
    container_name: promtail
    restart: *restart
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring
    depends_on:
      - loki

  # ── Tempo (trace storage) ───────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.9.4
    container_name: tempo
    user: "0:0"
    restart: *restart
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"     # Tempo query / status
      # OTLP ports not exposed on host for Tempo direct — send traces to otel-collector instead
    networks:
      - monitoring

  # ── OpenTelemetry Collector (pipeline/processor for traces, metrics, logs)
  #otel-collector:
  #  image: otel/opentelemetry-collector-contrib:latest
  #  container_name: otel-collector
  #  restart: *restart
  #  command: [ "--config=/etc/otelcol/config.yaml" ]
  #  volumes:
  #    - ./otel-collector/otel-config.yaml:/etc/otelcol/config.yaml:ro
  #  ports:
  #    - "8888:8888"     # Collector Prometheus metrics
  #    - "4317:4317"     # OTLP gRPC (send traces/metrics/logs here from apps)
  #    - "4318:4318"     # OTLP HTTP
  #    - "9411:9411"     # Zipkin compatibility
  #    - "14268:14268"   # Jaeger Thrift HTTP compatibility
  #  networks:
  #    - monitoring
  #  depends_on:
  #    - tempo
  #    - loki
  #    - prometheus

  # ── HotROD demo app (generates sample traces across fake microservices) ──
  hotrod:
     image: jaegertracing/example-hotrod:2.20.0
     container_name: hotrod
     restart: *restart
     command: [ "all" ]
     environment:
       OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
       OTEL_EXPORTER_OTLP_INSECURE: "true"
     ports:
       - "8081:8080"
     networks:
       - monitoring
     depends_on:
       - tempo

  # ── Grafana ──────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: grafana
    restart: *restart
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123      # CHANGE after first login
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_INSTALL_PLUGINS: ""                    # add plugin IDs comma-separated
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
    ports:
      - "3000:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki
