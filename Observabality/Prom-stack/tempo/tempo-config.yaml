# ─────────────────────────────────────────────────────────────────────────────
# Tempo (local dev, single binary, local disk)
# Apps send OTLP directly to Tempo on :4317/:4318.
# ─────────────────────────────────────────────────────────────────────────────

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"
        grpc:
          endpoint: "0.0.0.0:4317"

ingester:
  max_block_duration: 5m
  trace_idle_period: 10s

compactor:
  compaction:
    block_retention: 336h          # 14 days

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal
    pool:
      max_workers: 100
      queue_depth: 10000

# Generate span metrics (calls_total, duration_seconds) and expose them on
# Tempo's /metrics for Prometheus to scrape. No remote-write needed in dev.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /tmp/tempo/generator/wal

analytics:
  reporting_enabled: false