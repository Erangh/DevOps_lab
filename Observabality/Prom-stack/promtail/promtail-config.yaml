# ─────────────────────────────────────────────────────────────────────────────
# Promtail (local dev) — ships Docker container logs and selected host logs
# to Loki.
# ─────────────────────────────────────────────────────────────────────────────

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ── Docker container logs ──────────────────────────────────────────────
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        target_label: container
        regex: "/(.*)"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      # Drop PII/noisy internal containers if needed:
      # - source_labels: ["container"]
      #   regex: "(prometheus|alertmanager)"
      #   action: drop

  # ── Host syslog/auth logs (Linux only, adjust paths for your OS) ──────
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          __path__: /var/log/syslog
    pipeline_stages:
      - multiline:
          firstline: ^\w{3}\s+\d{1,2}\s\d{2}:\d{2}:\d{2}

  - job_name: auth-log
    static_configs:
      - targets:
          - localhost
        labels:
          job: auth
          __path__: /var/log/auth.log
